<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tangle Interchange Importer</title>
    <style>
      :root { color-scheme: light dark; font: 12px/1.45 Inter, system-ui, sans-serif; }
      body { margin: 0; padding: 24px; color: var(--figma-color-text); background: var(--figma-color-bg); }
      h1 { margin: 0 0 8px; font-size: 18px; }
      p { margin: 0 0 18px; color: var(--figma-color-text-secondary); }
      label { display: block; padding: 24px 16px; border: 1px dashed var(--figma-color-border); border-radius: 8px; text-align: center; cursor: pointer; }
      label:hover { border-color: var(--figma-color-border-brand); background: var(--figma-color-bg-hover); }
      input { display: none; }
      button { width: 100%; margin-top: 12px; padding: 10px 12px; border: 0; border-radius: 6px; color: var(--figma-color-text-onbrand); background: var(--figma-color-bg-brand); font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .45; }
      #status { min-height: 34px; margin-top: 14px; overflow-wrap: anywhere; }
      .error { color: var(--figma-color-text-danger); }
      .success { color: var(--figma-color-text-success); }
    </style>
  </head>
  <body>
    <h1>Import Tangle design</h1>
    <p>Select a <code>tangle-figma-interchange</code> JSON file. The plugin validates it before changing this Figma file.</p>
    <label for="file"><strong id="file-name">Choose interchange JSON</strong><input id="file" type="file" accept="application/json,.json" /></label>
    <button id="import" disabled>Import into Figma</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script>
      const fileInput = document.getElementById('file');
      const importButton = document.getElementById('import');
      const fileName = document.getElementById('file-name');
      const status = document.getElementById('status');
      let json = '';
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0];
        json = file ? await file.text() : '';
        fileName.textContent = file ? file.name : 'Choose interchange JSON';
        importButton.disabled = !json;
        status.textContent = '';
      });
      importButton.addEventListener('click', () => {
        importButton.disabled = true;
        status.className = '';
        status.textContent = 'Validating and importing…';
        parent.postMessage({ pluginMessage: { type: 'import', json } }, '*');
      });
      window.onmessage = (event) => {
        const message = event.data && event.data.pluginMessage;
        if (!message || message.type !== 'result') return;
        importButton.disabled = false;
        status.className = message.ok ? 'success' : 'error';
        status.textContent = message.message;
      };
    </script>
  </body>
</html>
